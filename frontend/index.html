```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator V6 - Auto CI/CD</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e3a8a);
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    height:100vh;
}

h1{
    color:white;
    margin-bottom:10px;
    text-align:center;
}

p{
    color:#dbeafe;
    margin-bottom:20px;
    text-align:center;
}

.calculator{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 0 30px rgba(0,0,0,0.4);
}

#result{
    width:100%;
    height:60px;
    font-size:24px;
    text-align:right;
    border:2px solid #94a3b8;
    border-radius:10px;
    margin-bottom:15px;
    padding-right:10px;
    box-sizing:border-box;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,70px);
    gap:10px;
}

button{
    height:60px;
    border:none;
    border-radius:10px;
    color:white;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

.number{
    background:#2563eb;
}

.operator{
    background:#dc2626;
}

.equal{
    background:#16a34a;
    grid-column:span 2;
}

.clear{
    background:#7c3aed;
    grid-column:span 2;
}

button:hover{
    opacity:0.85;
}

.footer{
    color:white;
    margin-top:20px;
    font-size:15px;
}
</style>
</head>

<body>

<h1>🚀 Jenkins Auto Deployed Calculator V6</h1>
<p>GitHub → Jenkins → Docker → Automatic Deployment Working</p>

<div class="calculator">

<input type="text" id="result" disabled>

<div class="buttons">

<button class="number" onclick="appendValue('7')">7</button>
<button class="number" onclick="appendValue('8')">8</button>
<button class="number" onclick="appendValue('9')">9</button>
<button class="operator" onclick="appendValue('/')">÷</button>

<button class="number" onclick="appendValue('4')">4</button>
<button class="number" onclick="appendValue('5')">5</button>
<button class="number" onclick="appendValue('6')">6</button>
<button class="operator" onclick="appendValue('*')">×</button>

<button class="number" onclick="appendValue('1')">1</button>
<button class="number" onclick="appendValue('2')">2</button>
<button class="number" onclick="appendValue('3')">3</button>
<button class="operator" onclick="appendValue('-')">−</button>

<button class="number" onclick="appendValue('0')">0</button>
<button class="number" onclick="appendValue('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
<button class="operator" onclick="appendValue('+')">+</button>

<button class="clear" onclick="clearResult()">Clear</button>

</div>
</div>

<div class="footer">
Version 6 | Auto CI/CD using GitHub, Jenkins & Docker
</div>

<script>
const result = document.getElementById("result");

function appendValue(value){
    result.value += value;
}

function calculate(){
    try{
        result.value = eval(result.value);
    }catch(error){
        result.value = "Error";
    }
}

function clearResult(){
    result.value = "";
}
</script>

</body>
</html>
```
