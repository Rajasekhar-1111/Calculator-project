<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator V10 - Jenkins Auto Deployment</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(135deg,#ff512f,#dd2476);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.header{
    text-align:center;
    margin-bottom:20px;
    color:white;
}

.header h1{
    font-size:40px;
}

.header p{
    font-size:18px;
    margin-top:10px;
}

.version{
    background:black;
    color:yellow;
    padding:10px 25px;
    border-radius:30px;
    font-size:22px;
    font-weight:bold;
    margin-top:15px;
}

.calculator{
    background:white;
    padding:25px;
    border-radius:25px;
    box-shadow:0px 0px 30px rgba(0,0,0,0.4);
}

#result{
    width:100%;
    height:70px;
    font-size:30px;
    text-align:right;
    padding-right:15px;
    border:3px solid #333;
    border-radius:12px;
    margin-bottom:20px;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,80px);
    gap:12px;
}

button{
    height:70px;
    border:none;
    border-radius:12px;
    font-size:24px;
    font-weight:bold;
    cursor:pointer;
    color:white;
}

.num{
    background:#0984e3;
}

.op{
    background:#d63031;
}

.equal{
    background:#00b894;
    grid-column:span 2;
}

.clear{
    background:#6c5ce7;
    grid-column:span 2;
}

button:hover{
    transform:scale(1.05);
    transition:0.2s;
}

.footer{
    margin-top:20px;
    color:white;
    font-size:18px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
    <h1>🚀 Jenkins Auto Deployment Demo</h1>
    <p>GitHub → Jenkins → Docker → Live Update</p>
    <div class="version">VERSION 10</div>
</div>

<div class="calculator">

<input type="text" id="result" disabled>

<div class="buttons">

<button class="num" onclick="appendValue('7')">7</button>
<button class="num" onclick="appendValue('8')">8</button>
<button class="num" onclick="appendValue('9')">9</button>
<button class="op" onclick="appendValue('/')">÷</button>

<button class="num" onclick="appendValue('4')">4</button>
<button class="num" onclick="appendValue('5')">5</button>
<button class="num" onclick="appendValue('6')">6</button>
<button class="op" onclick="appendValue('*')">×</button>

<button class="num" onclick="appendValue('1')">1</button>
<button class="num" onclick="appendValue('2')">2</button>
<button class="num" onclick="appendValue('3')">3</button>
<button class="op" onclick="appendValue('-')">−</button>

<button class="num" onclick="appendValue('0')">0</button>
<button class="num" onclick="appendValue('.')">.</button>
<button class="equal" onclick="calculate()">=</button>
<button class="op" onclick="appendValue('+')">+</button>

<button class="clear" onclick="clearResult()">CLEAR</button>

</div>
</div>

<div class="footer">
✅ CI/CD Pipeline Working Successfully
</div>

<script>
const result = document.getElementById("result");

function appendValue(value){
    result.value += value;
}

function calculate(){
    try{
        result.value = eval(result.value);
    }catch(error){
        result.value = "Error";
    }
}

function clearResult(){
    result.value = "";
}
</script>

</body>
</html>
